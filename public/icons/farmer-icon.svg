<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="farmerBgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="farmerGlowGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Emerald Rounded Square Background -->
  <rect width="512" height="512" rx="115" fill="url(#farmerBgGradient)" />
  <rect width="512" height="256" rx="115" fill="url(#farmerGlowGradient)" />

  <!-- White Tractor + Phone Dispatch Mark -->
  <g transform="translate(42, 42) scale(0.835)">
    <!-- Wireless Signal Waves -->
    <path d="M260 52 C285 52, 308 63, 324 81" stroke="#ffffff" stroke-width="22" stroke-linecap="round" fill="none" />
    <path d="M245 88 C262 88, 278 96, 290 110" stroke="#ffffff" stroke-width="20" stroke-linecap="round" fill="none" />
    <circle cx="260" cy="142" r="16" fill="#ffffff" />

    <!-- Phone Handset -->
    <path d="M210 105 C202 96 188 94 178 102 L150 125 C142 132 140 144 146 153 C166 184 195 212 227 232 C236 238 248 236 255 228 L278 200 C286 190 284 176 275 168 L245 142 C237 135 225 137 218 145 L210 155 C190 145 175 130 165 110 L175 102 Z" fill="#ffffff" />

    <!-- Steering Column -->
    <line x1="125" y1="165" x2="85" y2="215" stroke="#ffffff" stroke-width="24" stroke-linecap="round" />
    <line x1="70" y1="200" x2="105" y2="235" stroke="#ffffff" stroke-width="22" stroke-linecap="round" />

    <!-- Tractor Hood & Cab Outline -->
    <path d="M130 215 L130 250 L345 250 C385 250 415 280 415 320 L415 345 L385 345" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Grille Slots -->
    <line x1="285" y1="275" x2="390" y2="275" stroke="#ffffff" stroke-width="20" stroke-linecap="round" />
    <line x1="345" y1="305" x2="390" y2="305" stroke="#ffffff" stroke-width="20" stroke-linecap="round" />

    <!-- Chassis connecting wheels -->
    <line x1="220" y1="375" x2="320" y2="375" stroke="#ffffff" stroke-width="22" stroke-linecap="round" />

    <!-- Rear Big Wheel -->
    <circle cx="150" cy="365" r="86" stroke="#ffffff" stroke-width="24" fill="none" />

    <!-- Front Wheel -->
    <circle cx="375" cy="385" r="66" stroke="#ffffff" stroke-width="24" fill="none" />

    <!-- Ground Motion Speed Lines -->
    <line x1="30" y1="452" x2="150" y2="452" stroke="#ffffff" stroke-width="22" stroke-linecap="round" />
    <line x1="275" y1="452" x2="410" y2="452" stroke="#ffffff" stroke-width="22" stroke-linecap="round" />
  </g>
</svg>
